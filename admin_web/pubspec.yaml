name: srs_review_ai_admin_web
description: "SRS Review AI — Admin Web (Flutter Web, giảng viên/quản trị viên)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # UI — web compatible only (no native plugins)
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

  # Firebase — web supported products only (Crashlytics is not supported on web)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_analytics: ^13.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_remote_config: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/icons/
