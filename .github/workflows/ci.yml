name: CI

on:
  # Manual runs matter here: the Windows and macOS runners are the only place
  # the native code is ever compiled, and a push is not always what you want to
  # make just to see it. `gh workflow run CI` or the Actions tab both work.
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The line-ending report below diffs against the commit the push
          # came from; the default depth of 1 leaves both HEAD^ and
          # github.event.before unresolvable, and the report would fall back
          # to measuring the whole tree -- loud, but not what a push
          # deserves. History here is small; full depth is cheap.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # No dependencies on purpose: the guardrails must run even when nothing
      # else in the repo installs.
      - run: python3 tools/check_guardrails.py
      # Prints the CR numbers behind rule 9 per changed file, so whole-file
      # churn (and the bare-CR mechanism that makes git store a file as
      # -text) is visible in the log at push time instead of surfacing in a
      # later audit. Runs with `if: always()` because a push that trips the
      # rule above is exactly the push whose numbers are worth reading.
      - run: python3 tools/report_line_endings.py
        if: always()
        env:
          # Empty on pull_request; the tool then uses HEAD^.
          LINE_ENDINGS_BASE: ${{ github.event.before }}

  server:
    name: Server (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Runs entirely on the offline mock provider — no API key in CI.
      - run: pytest

  app:
    name: App (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the toolchain the code is actually written and formatted
          # with (Dart 3.13.2). CI on an older Dart formats differently, so
          # `dart format --set-exit-if-changed` fails on files that are
          # canonical on every developer machine — a gate nobody can pass.
          # Bump BOTH occurrences together when the team upgrades.
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      # Zero tolerance: infos fail too, so lint debt cannot accumulate.
      - run: flutter analyze --fatal-infos --fatal-warnings
      # CI logs need a sign-in to read; annotations do not. The step below
      # re-emits each failure as a public ::error so the check page names
      # the failing test without opening the log.
      - id: test
        run: flutter test --file-reporter json:test_report.json
      - if: failure() && steps.test.outcome == 'failure'
        run: python3 ../tools/annotate_test_failures.py test_report.json

  # web-ui talks to the server now (ADR-0020), so it is no longer a prototype
  # that can only be looked at. Until this job existed nothing checked it: not
  # the TypeScript, not the build. The docker-build job below compiles the SPA
  # inside an image, which catches a broken build but NOT a type error — `vite
  # build` transpiles without type-checking, so a `tsc --noEmit` failure ships
  # as a runtime crash. Both steps are here for that reason.
  #
  # `--frozen-lockfile` on purpose: it turns a lockfile that drifted from
  # package.json into a CI failure instead of a silent dependency bump.
  web-ui:
    name: web-ui (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # The tests exist because two bugs shipped through tsc AND a successful
      # build: a status vocabulary that was wrong in both directions, and a
      # timeline that dropped its first and last entries. Type-checking cannot
      # see either — the first was a value in a `Record`, the second was which
      # of two fields got read.
      - run: pnpm test
      - run: pnpm build

  # The only automated verification either desktop native runner gets.
  #
  # Why it is here: the app ships a Windows runner (native window sizing in
  # windows/runner/**) and a macOS runner (NSWindow sizing and entitlements in
  # macos/Runner/**), and the development machine can build NEITHER. Windows
  # needs a Windows host; macOS has Command Line Tools only and no Xcode, so
  # `xcodebuild` is missing and `flutter build macos` cannot even start — QA got
  # no further than `swiftc -parse`. Without this job every native change is
  # eye-reviewed only. See docs/desktop/WINDOWS-REVIEW-CHECKLIST.md.
  #
  # Why analyze + test AND a real build: `flutter analyze` and `flutter test`
  # are platform-agnostic. They prove the Dart half of the desktop work
  # (platform detection, breakpoints, the shortcut layer) behaves the same on a
  # desktop host, which is the part that could silently differ — but neither of
  # them compiles a single line of C++ or Swift.
  #
  # `flutter build ${{ matrix.target }} --debug` is the only step that actually
  # invokes MSVC over windows/runner/** or the Apple toolchain over
  # macos/Runner/**. Both Windows defects found in review (a method called
  # without a declaration in win32_window.h, and a min-size member that was
  # written but never read) passed analyze and test cleanly and broke the build
  # outright; nothing short of compiling catches that class of bug. macOS is the
  # one desktop target we can genuinely run, so it is also the cheapest early
  # warning available.
  #
  # This job is a GATE, not a warning light. It deliberately has no
  # `continue-on-error`: the build step below is the only thing in the whole
  # pipeline that compiles C++/Swift, and the two Windows P0s found in review
  # (a method called without a declaration in win32_window.h, and a min-size
  # member written but never read) both passed analyze and test cleanly. A job
  # that can detect that class of bug but is not allowed to fail is decoration.
  #
  # If the FIRST run goes red for a toolchain reason and not a code reason, the
  # escape hatch is exactly one line — `continue-on-error: true` — but it must
  # be added with a dated issue to remove it, never on its own. A mute with no
  # removal date is how a "temporary" flag outlives the reason it was added, and
  # that is precisely how we would end up shipping a Windows target that has
  # never been compiled. Prefer fixing the job over muting it.
  desktop-verify:
    name: ${{ matrix.name }} verify (analyze + test + build)
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: the value of this job is
      # telling the desktop workstream WHICH platform broke.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: windows
          - os: macos-latest
            name: macOS
            target: macos
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - id: test
        run: flutter test --file-reporter json:test_report.json
      - if: failure() && steps.test.outcome == 'failure'
        run: python3 ../tools/annotate_test_failures.py test_report.json
      # Debug, not release: the fastest target that still runs the platform
      # compiler and linker over every file in the runner directory.
      - run: flutter build ${{ matrix.target }} --debug

  # Builds the two production images from the repository, so a Dockerfile that
  # stops parsing (or a lockfile that stops resolving) is caught here instead of
  # on the VPS. Nothing is pushed: this proves the build, not the release.
  #
  # The web-ui build needs a named build context for nginx.conf, which is why
  # this uses `--build-context` rather than a plain `docker build`. Both builds
  # run with no secrets: the API image bakes no .env, and the SPA is compiled
  # from source, so nothing here needs GEMINI_API_KEY or APP_TOKEN.
  docker-build:
    name: Docker images (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          load: true
          tags: srs-review-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webui.Dockerfile
          build-contexts: |
            cfg=./docker
          push: false
          load: true
          tags: srs-review-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke the API image (startup + /health)
        run: |
          docker run -d --name ci-api -p 8000:8000 srs-review-api:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then echo "health=200 after ${i}s"; break; fi
            sleep 2
          done
          docker ps --filter name=ci-api --format '{{.Status}}'
          curl -s http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "200"
          docker logs ci-api 2>&1 | tail -5
      - name: Smoke the web image (index + SPA fallback)
        run: |
          docker run -d --name ci-web -p 8080:80 srs-review-web:ci
          sleep 5
          docker ps --filter name=ci-web --format '{{.Status}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/reviews/review-006)" = "200"
      - if: always()
        run: |
          docker logs ci-api 2>&1 | tail -30 || true
          docker logs ci-web 2>&1 | tail -20 || true
          docker rm -f ci-api ci-web 2>/dev/null || true
