name: srs_review_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  file_picker: ^12.2.0
  file_selector: ^1.1.0
  # firebase_core pulled the Firebase C++ SDK into the Windows build, whose
  # cmake_minimum_required(VERSION 3.1) breaks CMake 4.x (MSB3073). Not used by
  # any Dart code in this app; disabled to unblock the Windows desktop build.
  # firebase_core: ^3.15.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  qr_flutter: ^4.1.0
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^34.2.7
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Both files are VARIABLE fonts (they carry an `fvar` table), so one
    # declaration covers every weight on the axis. Listing the same file once
    # per weight — as this used to — made Flutter web fetch it five times per
    # family: measured as 5x235KB (DM Sans) + 5x165KB (Manrope) = ~1.6MB of
    # pure duplicate traffic on every cold load.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  assets:
    - assets/fonts/OFL.txt
    - assets/fixtures/dashboard.json
    - assets/fixtures/academic.json
    - assets/fixtures/notifications.json
    - assets/icons/
