# Served by the web-ui image. React Router owns every route, so unknown paths
# fall back to index.html instead of 404 -- a deep link like /reviews/xyz must
# work on first load, not only after client-side navigation.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these never change under a given
    # name and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
