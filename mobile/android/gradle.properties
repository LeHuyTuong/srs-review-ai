# Giới hạn bộ nhớ để build cùng emulator trên máy 12 GB RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=2 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
# Cache Pub ở ổ C, project ở ổ D: Kotlin incremental không ánh xạ được hai root.
# Biên dịch trong Gradle tránh daemon phụ và lỗi cache đường dẫn trên Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
