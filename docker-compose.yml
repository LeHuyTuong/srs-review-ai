services:
  db:
    image: postgres:15-alpine
    container_name: srs_postgres
    restart: always
    environment:
      POSTGRES_USER: srs_user
      POSTGRES_PASSWORD: srs_password
      POSTGRES_DB: srs_review_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srs_user -d srs_review_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    container_name: srs_fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://srs_user:srs_password@db:5432/srs_review_db
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-srs-review-ai-ff68b}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/firebase-admin.json}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
