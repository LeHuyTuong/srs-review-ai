# SRS Review AI — server stack (generated by `docker init`, then adapted).
# Reference: https://docs.docker.com/go/compose-spec-reference/
#
# Build and publish the image (on your machine, after `docker login`):
#   docker compose build
#   docker compose push server
#
# Run it (VPS or local), from server/:
#   docker compose pull           # fetch anhvietanh1123/srs-review-ai:latest
#   docker compose up -d          # API on 127.0.0.1:8000
#   curl -s http://127.0.0.1:8000/health
#
# server/.env is read twice: as env_file (what the server sees) and for the
# ${...} substitutions below. Never put it in the image — .dockerignore
# excludes it, and the image is public on Docker Hub.
#   APP_TOKEN    -> empty means NO auth at all, so compose refuses to start.
#   CORS_ORIGINS -> browser origins allowed; empty = none. The Flutter apps
#                   are not browsers and do not need it. Never "*" in public.
services:
  server:
    image: anhvietanh1123/srs-review-ai:latest
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_TOKEN: "${APP_TOKEN:?set APP_TOKEN in server/.env; an empty value disables auth}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # Without X-User-Id the daily quota is keyed by client IP; behind a
      # reverse proxy that IP would be the proxy's for everyone. Trusting
      # X-Forwarded-For restores the real client IP.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - srs-review-data:/data
    ports:
      # Loopback by default: reachable from the VPS itself and from Caddy,
      # not from the internet over plain HTTP. Set API_BIND=0.0.0.0 in .env
      # only for a quick test without a domain.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS in front of the API. Off unless .env sets COMPOSE_PROFILES=https
  # and DOMAIN=<your domain> (A record pointing at the VPS, ports 80/443 open).
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    depends_on:
      - server
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  # Cache, uploads, shares, submissions, class rosters — back this one up.
  srs-review-data:
  caddy-data:
  caddy-config:
