# Server-only stack: the FastAPI proxy, plus an optional Caddy in front of it
# for HTTPS. The Flutter apps (desktop/, mobile/) are clients and are NOT
# deployed here — they point at this server through API_BASE_URL.
#
# Run from server/:
#
#   cp .env.example .env              # fill GEMINI_API_KEY (empty => mock provider)
#   export APP_TOKEN=$(openssl rand -hex 32)
#
#   docker compose up -d --build                                   # API only, on 127.0.0.1:8000
#   DOMAIN=api.example.com docker compose --profile https up -d --build   # + HTTPS on 80/443
#
#   curl -s http://127.0.0.1:8000/health
#
# Two values are taken from the shell, NOT from server/.env, because their
# settings.py defaults are unsafe on a public host and a stale .env copied from
# .env.example would silently re-open them:
#   APP_TOKEN    -> default "" DISABLES auth entirely, and it is also the HMAC
#                   key for presigned-upload tokens. Compose refuses to start
#                   without it. Every client must send it as X-App-Token.
#   CORS_ORIGINS -> default "*" lets any web page call the API. Here it defaults
#                   to EMPTY (no browser origin allowed); the native Flutter
#                   apps do not use CORS and are unaffected. Set it only if a
#                   browser client must call the API, e.g.
#                   CORS_ORIGINS=https://review.example.com

services:
  api:
    build: .
    image: srs-review-api:local
    env_file:
      - .env
    environment:
      APP_TOKEN: "${APP_TOKEN:?set APP_TOKEN before starting; an empty value disables auth}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # Without X-User-Id the daily quota is keyed by client IP. Behind Caddy
      # that IP would be Caddy's for every caller — one shared quota for all.
      # Trusting X-Forwarded-For restores the real client IP.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - srs-review-data:/data
    ports:
      # Loopback only by default: reachable from the VPS itself (curl, Caddy
      # uses the compose network) but not from the internet over plain HTTP.
      # API_BIND=0.0.0.0 exposes it directly — only for a quick test.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    depends_on:
      - api
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  # Cache, uploads, shares, submissions, class rosters — back this one up.
  srs-review-data:
  caddy-data:
  caddy-config:
