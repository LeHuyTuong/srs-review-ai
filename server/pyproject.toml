[project]
name = "srs-review-ai-proxy"
version = "1.0.0"
description = "Thin LLM proxy for the SRS Review AI capstone app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --basetemp=.pytest_temp -p no:cacheprovider"



[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = [
    "S101", # assert is fine in tests
    "B008", # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
# server/alembic/ (migration scripts) shares its name with the installed package;
# without this ruff sorts `from alembic import op` as first-party.
known-third-party = ["alembic"]
