name: srs_review_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  dio: ^5.11.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  pdfx: ^2.11.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^34.2.7
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Both files are VARIABLE fonts (they carry an `fvar` table), so one
    # declaration covers every weight on the axis. Listing the same file once
    # per weight — as this used to — made Flutter web fetch it five times per
    # family: measured as 5x235KB (DM Sans) + 5x165KB (Manrope) = ~1.6MB of
    # pure duplicate traffic on every cold load.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
