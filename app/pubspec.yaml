name: srs_review_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.2.0
  dio: ^5.11.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^34.2.7
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
        - asset: assets/fonts/Manrope.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
          weight: 400
        - asset: assets/fonts/DMSans.ttf
          weight: 500
        - asset: assets/fonts/DMSans.ttf
          weight: 600
        - asset: assets/fonts/DMSans.ttf
          weight: 700
        - asset: assets/fonts/DMSans.ttf
          weight: 800
